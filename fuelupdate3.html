<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสร้างรูปแจ้งปรับราคาน้ำมัน (แบบใหม่)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลดฟอนต์ Prompt เข้ามาใช้งาน (น้ำหนัก 600, 700 สำหรับ Bold) -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ดึงฟอนต์ Cloud สำหรับ UI */
        @font-face {
            font-family: 'Cloud';
            src: url('https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/Cloud/Cloud-Light.woff2') format('woff2'),
                 url('https://rawcdn.githack.com/lazywasabi/thai-web-fonts/master/fonts/Cloud/Cloud-Light.ttf') format('truetype');
            font-weight: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Cloud';
            src: url('https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/Cloud/Cloud-Bold.woff2') format('woff2'),
                 url('https://rawcdn.githack.com/lazywasabi/thai-web-fonts/master/fonts/Cloud/Cloud-Bold.ttf') format('truetype');
            font-weight: bold;
            font-display: swap;
        }

        /* บังคับให้หน้าเว็บ UI ใช้ฟอนต์ Cloud ส่วน Canvas จะดึง Prompt ไปใช้ */
        body { font-family: 'Cloud', 'Kanit', sans-serif; }
        
        /* ซ่อนลูกศรใน input type number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .fuel-card {
            transition: all 0.2s ease-in-out;
        }
        .fuel-card:focus-within {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-10">

    <!-- Header -->
    <div class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
        <h1 class="text-xl font-bold text-center" style="font-family: 'Cloud', sans-serif;">ระบบสร้างรูปแจ้งปรับราคาน้ำมัน (กรอบใหม่)</h1>
        <p class="text-center text-blue-200 text-xs mt-1" style="font-family: 'Prompt', sans-serif;">อัปเดตระบบ : 8.7.69 เพิ่มระบบดึงข้อมูลสำรอง</p>
    </div>

    <div class="max-w-xl mx-auto mt-6 px-4">
        
        <!-- ส่วนกรอกข้อมูล -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-6">
            
            <!-- ส่วนอัปโหลดรูปต้นฉบับ (ซ่อนไว้ใช้กรณีลิงก์พัง) -->
            <div class="hidden mb-6 bg-orange-50 p-4 rounded-lg border border-orange-200">
                <label class="block text-orange-800 font-bold mb-2">อัปโหลดภาพต้นฉบับ (หากภาพไม่ขึ้น)</label>
                <div class="text-xs text-gray-600 mb-2">ระบบพยายามดึงภาพอัตโนมัติ หากกดสร้างรูปไม่ได้ ให้อัปโหลดภาพต้นฉบับเองที่นี่ครับ</div>
                <input type="file" id="imageUpload" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-600 file:text-white hover:file:bg-orange-700">
            </div>

            <!-- วันที่และเวลา -->
            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2 text-lg" style="font-family: 'Prompt', sans-serif;">วันที่และเวลา (ข้อความด้านบน)</label>
                <input type="text" id="dateTimeText" value="มีผล 31 เมษายน 2569 เวลา 05.00 น." 
                    oninput="saveData()" style="font-family: 'Prompt', sans-serif;"
                    class="w-full bg-blue-50 border border-blue-200 text-blue-800 text-center font-bold rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 mb-3">
            </div>

            <hr class="mb-6 border-gray-200">
            
            <!-- หัวข้อราคาน้ำมัน + ปุ่มดึงข้อมูล/ล้างข้อมูล -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
                <h2 class="text-gray-700 font-bold text-lg">กรอกราคาน้ำมัน (บาท/ลิตร)</h2>
                <div class="flex gap-2 w-full sm:w-auto">
                    <button type="button" onclick="clearAllData()" class="flex-1 sm:flex-none bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs font-bold py-2 px-3 rounded-lg transition-colors flex justify-center items-center gap-1 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        ล้างค่า
                    </button>
                    <button type="button" id="fetchPriceBtn" onclick="fetchChiangMaiPrices()" class="flex-1 sm:flex-none bg-blue-100 hover:bg-blue-200 text-blue-700 text-xs font-bold py-2 px-3 rounded-lg transition-colors flex justify-center items-center gap-1 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
                        ดึงราคาปัจจุบัน
                    </button>
                </div>
            </div>

            <!-- เลือกแหล่งดึงข้อมูล (ซ่อนไว้ก่อน กดเปิดจึงแสดงตัวเลือก) -->
            <div class="mb-5 bg-gray-50 border border-gray-200 rounded-xl p-3">
                <button type="button" onclick="toggleOilSourceMenu()" class="w-full flex items-center justify-between gap-2 text-left">
                    <span class="text-xs text-gray-600 font-bold">แหล่งดึงข้อมูล</span>
                    <span class="flex items-center gap-2">
                        <span id="oilSourceCurrentText" class="text-[10px] bg-white text-blue-700 border border-blue-100 px-2 py-1 rounded-full font-bold">อัตโนมัติ</span>
                        <svg id="oilSourceChevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400 transition-transform duration-200"><path d="m6 9 6 6 6-6"/></svg>
                    </span>
                </button>
                <div id="oilSourceMenu" class="hidden mt-3">
                    <div id="oilSourceButtons" class="grid grid-cols-3 gap-2">
                        <button type="button" data-source="auto" onclick="setOilSource('auto')" class="oil-source-btn text-xs font-bold py-2 px-2 rounded-lg border transition-colors">อัตโนมัติ</button>
                        <button type="button" data-source="bangchak" onclick="setOilSource('bangchak')" class="oil-source-btn text-xs font-bold py-2 px-2 rounded-lg border transition-colors">บางจาก</button>
                        <button type="button" data-source="chnwt" onclick="setOilSource('chnwt')" class="oil-source-btn text-xs font-bold py-2 px-2 rounded-lg border transition-colors">ไทยออยล์</button>
                    </div>
                </div>
            </div>

            <!-- รายการน้ำมัน -->
            <div id="fuelInputs" class="space-y-4">
                <!-- ข้อมูลจะถูกสร้างด้วย JavaScript -->
            </div>

            <!-- ปุ่มสร้างรูป -->
            <button type="button" id="generateBtn" onclick="generatePreview()" 
                class="w-full mt-8 bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-4 px-6 rounded-xl shadow-lg transition duration-200 flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg> สร้างรูปภาพ / ดูตัวอย่าง
            </button>
        </div>

        <!-- ส่วนแสดงผลรูปภาพ (กลับมาอยู่ด้านล่างตามปกติ) -->
        <div id="previewSection" class="hidden bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-6 animate-[fadeIn_0.5s_ease-out]">
            <h2 class="text-gray-800 font-bold mb-4 text-lg text-center">ตัวอย่างรูปภาพ</h2>
            
            <!-- แถบสไลด์ปรับตำแหน่ง X ของวันที่ (อยู่ด้านบนรูปภาพ จะได้มองเห็นชัดๆ) -->
            <div class="bg-gray-100 p-3 rounded-lg border border-gray-200 mb-4">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs text-gray-600 font-bold">ปรับตำแหน่งซ้าย-ขวา (แกน X)</label>
                    <div class="flex items-center gap-2">
                        <span id="dateXValue" class="text-xs bg-white px-2 py-1 rounded border font-mono">0.560</span>
                        <button type="button" onclick="resetDateXSlider()" class="text-[10px] bg-blue-100 hover:bg-blue-200 text-blue-700 px-2 py-1 rounded transition-colors" title="คืนค่าเริ่มต้น">
                            รีเซ็ต
                        </button>
                    </div>
                </div>
                <input type="range" id="dateXSlider" min="0.400" max="0.700" step="0.005" value="0.560" 
                       class="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer"
                       oninput="updateDateXSlider()">
                <div class="text-[10px] text-gray-500 text-center mt-1">ใช้สไลเดอร์นี้หากวันที่ในรูปไม่อยู่กึ่งกลาง (จะเห็นผลทันที)</div>
            </div>

            <div class="relative w-full rounded-lg overflow-hidden border-2 border-gray-300 shadow-inner bg-gray-100 flex justify-center mb-4">
                <!-- Canvas สำหรับวาดรูป -->
                <canvas id="canvas" class="max-w-full h-auto"></canvas>
            </div>

            <button type="button" onclick="downloadImage()" 
                class="w-full bg-green-500 hover:bg-green-600 text-white font-bold text-lg py-4 px-6 rounded-xl shadow-lg transition duration-200 flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                บันทึกรูปภาพ (JPG)
            </button>
        </div>

    </div>

    <!-- Custom Modal -->
    <div id="customModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-300" id="customModalContent">
            <h3 id="modalTitle" class="text-xl font-bold text-gray-800 mb-2" style="font-family: 'Cloud', sans-serif;">แจ้งเตือน</h3>
            <p id="modalMessage" class="text-gray-600 mb-6 text-sm"></p>
            <div id="modalButtons" class="flex justify-end gap-3"></div>
        </div>
    </div>

    <!-- โหลดรูปต้นฉบับผ่าน Cloudflare Worker -->
    <img id="baseImage" crossorigin="anonymous" 
         src="https://img-proxy.108khamwo.workers.dev/?url=https://img1.pic.in.th/images/oil_Resized.jpg" 
         class="hidden"
         onload="console.log('โหลดภาพพื้นหลังสำเร็จ')"
         onerror="console.error('โหลดภาพพื้นหลังล้มเหลว')">

    <script>
        // --- อัปเดตตัวเลขเมื่อเลื่อนสไลเดอร์ ---
        function updateDateXSlider() {
            const slider = document.getElementById('dateXSlider');
            document.getElementById('dateXValue').innerText = parseFloat(slider.value).toFixed(3);
            
            // ถ้ามีการสร้างรูปภาพไว้แล้ว ให้เรนเดอร์ใหม่ทันทีแบบเรียลไทม์
            const previewSection = document.getElementById('previewSection');
            if (!previewSection.classList.contains('hidden')) {
                // เรียกวาดรูปใหม่โดยไม่ต้องรอ setTimeout 50ms เพื่อให้เลื่อนแล้วเปลี่ยนทันที
                drawCanvasFast();
            }
        }

        // --- รีเซ็ตค่าสไลเดอร์ ---
        function resetDateXSlider() {
            const slider = document.getElementById('dateXSlider');
            slider.value = 0.560; // ค่าเริ่มต้น
            updateDateXSlider(); // เรียกอัปเดต UI และวาดรูปใหม่
        }

        // --- 1. การตั้งค่าตำแหน่งแกน X (แนวนอน) สำหรับกรอบใหม่ ---
        // ปรับเป็นเปอร์เซ็นต์ของความกว้างภาพ (960px)
        const posX = {
            oldPrice: 0.400, // กล่องราคาเดิม (ซ้าย) - อยู่ตำแหน่งเดิม
            newPrice: 0.600, // กล่องส่วนต่าง (กลาง) - ขยับซ้าย 1 step (เดิม 0.610)
            diff:     0.800  // กล่องราคาใหม่ (ขวา) - ปรับตำแหน่งใหม่เป็น 0.800
        };

        // --- 2. การตั้งค่าข้อมูลชนิดน้ำมันและตำแหน่งแกน Y (แนวตั้ง) ---
        // ปรับเป็นเปอร์เซ็นต์ของความสูงภาพ (1200px) และเพิ่ม offsetY เพื่อชดเชยตำแหน่งเป็นพิกเซล (px)
        const fuels = [
            { id: 'diesel', name: 'ดีเซล', color: 'bg-blue-800', yPos: 0.245, offsetY: 66 }, // Y = 360px
            { id: 'e85', name: 'แก๊สโซฮอล์ E85', color: 'bg-red-600', yPos: 0.360, offsetY: 48 }, // Y = 480px
            { id: 'e20', name: 'แก๊สโซฮอล์ E20', color: 'bg-orange-500', yPos: 0.475, offsetY: 30 }, // Y = 600px
            { id: 'g95', name: 'แก๊สโซฮอล์ 95', color: 'bg-yellow-500', yPos: 0.590, offsetY: 12 }, // Y = 720px
            { id: 'g91', name: 'แก๊สโซฮอล์ 91', color: 'bg-teal-500', yPos: 0.705, offsetY: -6 }  // Y = 840px
        ];


        // เก็บราคาดีเซล 2 ค่าที่ดึงได้ เพื่อให้ผู้ใช้สลับเองได้
        // กรณีแหล่งข้อมูลต้นฉบับสลับค่าดีเซลธรรมดากับดีเซลพรีเมียม
        const fetchedDieselPrices = {
            primary: null,
            alternate: null,
            using: 'primary'
        };

        // เลือกแหล่งดึงข้อมูล: ค่าเริ่มต้นยังเป็นอัตโนมัติ โดยเริ่มจากบางจากก่อน
        const oilSourceLabels = {
            auto: 'อัตโนมัติ',
            bangchak: 'บางจาก',
            chnwt: 'ไทยออยล์'
        };
        let selectedOilSource = localStorage.getItem('oilSourceChoice') || 'auto';
        if (!oilSourceLabels[selectedOilSource]) {
            selectedOilSource = 'auto';
            localStorage.setItem('oilSourceChoice', selectedOilSource);
        }

        function toggleOilSourceMenu(forceOpen = null) {
            const menu = document.getElementById('oilSourceMenu');
            const chevron = document.getElementById('oilSourceChevron');
            if (!menu) return;
            const shouldOpen = forceOpen === null ? menu.classList.contains('hidden') : !!forceOpen;
            menu.classList.toggle('hidden', !shouldOpen);
            if (chevron) chevron.style.transform = shouldOpen ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        function setOilSource(source) {
            selectedOilSource = oilSourceLabels[source] ? source : 'auto';
            localStorage.setItem('oilSourceChoice', selectedOilSource);
            updateOilSourceButtons();
            toggleOilSourceMenu(false);

            // เมื่อผู้ใช้เลือกแหล่งดึงข้อมูล ให้ดึงราคาจากแหล่งนั้นทันที
            setTimeout(() => {
                const fetchBtn = document.getElementById('fetchPriceBtn');
                if (fetchBtn && !fetchBtn.disabled) fetchChiangMaiPrices();
            }, 80);
        }

        function updateOilSourceButtons() {
            document.querySelectorAll('.oil-source-btn').forEach(btn => {
                const active = btn.dataset.source === selectedOilSource;
                btn.className = active
                    ? 'oil-source-btn text-xs font-bold py-2 px-2 rounded-lg border transition-colors bg-blue-600 text-white border-blue-600 shadow-sm'
                    : 'oil-source-btn text-xs font-bold py-2 px-2 rounded-lg border transition-colors bg-white text-gray-600 border-gray-200 hover:bg-blue-50 hover:text-blue-700';
            });

            const label = oilSourceLabels[selectedOilSource] || oilSourceLabels.auto;
            const currentText = document.getElementById('oilSourceCurrentText');
            if (currentText) currentText.innerText = label;

            const fetchBtn = document.getElementById('fetchPriceBtn');
            if (fetchBtn && !fetchBtn.disabled) {
                fetchBtn.title = selectedOilSource === 'auto'
                    ? 'ดึงข้อมูลอัตโนมัติ'
                    : `ดึงข้อมูลจาก ${label}`;
            }
        }

        // Proxy สำรอง: ใช้ Worker เดิมที่ระบบนี้ใช้โหลดภาพอยู่แล้วก่อน
        // เพื่อช่วยแก้ปัญหา CORS/เปิดไฟล์จากมือถือ แล้วค่อยลองตัวกลางสาธารณะอื่น ๆ
        const existingWorkerProxy = 'https://img-proxy.108khamwo.workers.dev/?url=';
        const getProxyUrls = (targetUrl) => ([
            targetUrl,
            existingWorkerProxy + encodeURIComponent(targetUrl),
            'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl),
            'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(targetUrl),
            'https://corsproxy.io/?url=' + encodeURIComponent(targetUrl)
        ]);

        // สร้าง Input Fields อัตโนมัติ
        const fuelInputsContainer = document.getElementById('fuelInputs');
        
        fuels.forEach(fuel => {
            const card = document.createElement('div');
            card.className = `fuel-card bg-white border border-gray-200 rounded-xl p-4`;
            card.innerHTML = `
                <div class="flex items-center mb-3">
                    <div class="w-4 h-4 rounded-full ${fuel.color} mr-2"></div>
                    <span class="font-bold text-gray-800 text-lg">${fuel.name}</span>
                    ${fuel.id === 'diesel' ? `
                        <button type="button" id="dieselSourceSwapBtn" onclick="toggleFetchedDieselPrice()"
                            class="hidden ml-auto bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-300 text-xs font-bold py-1.5 px-3 rounded-lg transition-colors shadow-sm"
                            title="สลับค่าราคาดีเซลที่ดึงมาจากแหล่งข้อมูล">
                            สลับค่าดีเซล
                        </button>
                    ` : ''}
                </div>
                <div class="grid grid-cols-[1fr_auto_1fr_1fr] gap-2 items-end">
                    <div>
                        <label class="block text-[10px] text-gray-500 mb-1 text-center font-bold">ราคาเดิม</label>
                        <input type="number" id="old_${fuel.id}" step="0.01" inputmode="decimal" placeholder="0.00"
                            class="w-full bg-gray-50 border border-gray-300 text-center font-bold text-gray-800 rounded-lg p-2 outline-none focus:ring-2 focus:ring-blue-500"
                            oninput="calculateDiff('${fuel.id}')"
                            onblur="formatPriceOnBlur('${fuel.id}', 'old')">
                    </div>
                    <div class="pb-1.5">
                        <button type="button" onclick="swapPrices('${fuel.id}')" class="p-1 hover:bg-gray-100 rounded-lg text-gray-400 transition-colors" title="สลับราคาเดิม-ราคาใหม่">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 8 4 4-4 4"/><path d="M2 12h20"/><path d="m6 8-4 4 4 4"/></svg>
                        </button>
                    </div>
                    <div>
                        <label class="block text-[10px] text-blue-500 mb-1 text-center font-bold">ราคาใหม่</label>
                        <input type="number" id="new_${fuel.id}" step="0.01" inputmode="decimal" placeholder="0.00"
                            class="w-full bg-blue-50 border border-blue-400 text-center font-bold text-blue-700 rounded-lg p-2 outline-none focus:ring-2 focus:ring-blue-500"

        function fetchWithTimeout(url, options = {}, timeoutMs = 12000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            return fetch(url, { ...options, signal: controller.signal })
                .finally(() => clearTimeout(timeoutId));
        }

        function parsePriceNumber(value) {
            if (value === undefined || value === null) return null;
            if (typeof value === 'object' && value.price !== undefined) value = value.price;
            const cleaned = String(value).replace(/,/g, '').replace(/[^0-9.\-]/g, '');
            const num = parseFloat(cleaned);
            return Number.isFinite(num) ? num : null;
        }

        function decodeHtmlEntities(text) {
            const textarea = document.createElement('textarea');
            textarea.innerHTML = text || '';
            return textarea.value;
        }

        function normalizeFuelText(text) {
            return String(text || '')
                .toLowerCase()
                .replace(/\s+/g, '')
                .replace(/-/g, '')
                .trim();
        }

        function hasAnyPrice(priceMap) {
            return Object.values(priceMap || {}).some(value => Number.isFinite(value));
        }

        // เลือกราคาดีเซลธรรมดาจากรายการที่มีชื่อกำกับ โดยเน้น ดีเซล/B7 และตัดพรีเมียมออกก่อน
        function selectRegularDieselFromNamedCandidates(candidates) {
            const valid = (candidates || [])
                .filter(item => item && Number.isFinite(item.price))
                .map(item => ({
                    name: String(item.name || ''),
                    text: normalizeFuelText(item.name || ''),
                    price: item.price
                }));

            if (valid.length === 0) return { primary: null, alternate: null };

            const nonPremium = valid.filter(item =>
                !item.text.includes('พรีเมียม') &&
                !item.text.includes('premium') &&
                !item.text.includes('ซูเปอร์') &&
                !item.text.includes('super')
            );

            const dieselPool = nonPremium.length ? nonPremium : valid;
            const preferredRegular = dieselPool.filter(item =>
                item.text.includes('b7') ||
                item.text === 'ดีเซล' ||
                item.text === 'diesel' ||
                (!item.text.includes('b10') && !item.text.includes('b20') && !item.text.includes('b5'))
            );

            const primaryPool = preferredRegular.length ? preferredRegular : dieselPool;
            primaryPool.sort((a, b) => a.price - b.price);

            const primary = primaryPool[0]?.price ?? null;
            const alternate = valid
                .filter(item => Number.isFinite(primary) && Math.abs(item.price - primary) > 0.001)
                .sort((a, b) => b.price - a.price)[0]?.price ?? null;

            return { primary, alternate };
        }

        async function fetchTextFromCandidates(urls, timeoutMs = 15000) {
            const errors = [];
            for (const url of urls) {
                try {
                    const response = await fetchWithTimeout(url, {}, timeoutMs);
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const text = await response.text();
                    if (text && text.trim()) return text;
                    throw new Error('ข้อมูลว่าง');
                } catch (error) {
                    errors.push(error.message || String(error));
                }
            }
            throw new Error(errors.join(' / '));
        }

        async function fetchJsonFromCandidates(urls, timeoutMs = 15000) {
            const text = await fetchTextFromCandidates(urls, timeoutMs);
            return JSON.parse(text);
        }

        async function fetchChnwtOilPrices() {
            const targetUrl = 'https://api.chnwt.dev/thai-oil-api/latest';
            const data = await fetchJsonFromCandidates(getProxyUrls(targetUrl), 15000);
            const ptt = data?.response?.stations?.ptt || data?.stations?.ptt || data?.ptt || {};
            const cmOffset = 0.7; // พื้นที่ อ.เมืองเชียงใหม่ (+0.7 บาท)

            const findStandardPrice = (keys) => {
                for (let key of keys) {
                    const num = parsePriceNumber(ptt[key]);
                    if (Number.isFinite(num)) return num + cmOffset;
                }
                return null;
            };

            const dieselFieldPrice = findStandardPrice(['diesel', 'ดีเซล']);
            const premiumDieselFieldPrice = findStandardPrice(['premium_diesel', 'diesel_premium', 'premiumDiesel', 'ดีเซลพรีเมียม']);

            // api.chnwt.dev เคยสลับช่อง diesel / premium_diesel กัน จึงใช้ราคาที่ต่ำกว่าเป็นดีเซลธรรมดา
            const chnwtDieselPrices = [dieselFieldPrice, premiumDieselFieldPrice]
                .filter(price => Number.isFinite(price))
                .sort((a, b) => a - b);
            const regularDieselPrice = chnwtDieselPrices.length > 0 ? chnwtDieselPrices[0] : null;
            const alternateDieselPrice = chnwtDieselPrices.length > 1 ? chnwtDieselPrices[chnwtDieselPrices.length - 1] : null;

            const priceMap = {
                'diesel': regularDieselPrice,
                'e85': findStandardPrice(['gasohol_e85', 'gasoholE85', 'e85', 'แก๊สโซฮอล์ E85']),
                'e20': findStandardPrice(['gasohol_e20', 'gasoholE20', 'e20', 'แก๊สโซฮอล์ E20']),
                'g95': findStandardPrice(['gasohol_95', 'gasohol95', 'e10_95', 'แก๊สโซฮอล์ 95']),
                'g91': findStandardPrice(['gasohol_91', 'gasohol91', 'e10_91', 'แก๊สโซฮอล์ 91'])
            };

            if (!hasAnyPrice(priceMap)) throw new Error('ไทยออยล์ไม่มีราคาที่อ่านได้');

            return {
                sourceName: 'ไทยออยล์',
                sourceNote: '',
                priceMap,
                dieselPrimary: regularDieselPrice,
                dieselAlternate: alternateDieselPrice
            };
        }

        function getBangchakRows(data) {
            const first = Array.isArray(data) ? data[0] : data;
            if (!first) return [];
            let oilList = first.OilList || first.oilList || first.oil_list || [];
            if (typeof oilList === 'string') {
                try { oilList = JSON.parse(oilList); }
                catch (error) { oilList = []; }
            }
            return Array.isArray(oilList) ? oilList : [];
        }

        function bangchakPrice(row) {
            return parsePriceNumber(row?.PriceToday ?? row?.PriceTomorrow ?? row?.PriceYesterday ?? row?.price ?? row?.Price);
        }

        function findBangchakPrice(rows, fuelId) {
            const candidates = [];
            rows.forEach(row => {
                const name = normalizeFuelText(row?.OilName || row?.Name || row?.name || '');
                const price = bangchakPrice(row);
                if (!Number.isFinite(price)) return;

                if (fuelId === 'e85' && name.includes('e85')) candidates.push(price);
                if (fuelId === 'e20' && name.includes('e20')) candidates.push(price);
                if (fuelId === 'g95' && name.includes('95') && name.includes('แก๊สโซฮอล์') && !name.includes('พรีเมียม') && !name.includes('premium')) candidates.push(price);
                if (fuelId === 'g91' && name.includes('91') && name.includes('แก๊สโซฮอล์') && !name.includes('พรีเมียม') && !name.includes('premium')) candidates.push(price);
            });
            return candidates.length ? candidates.sort((a, b) => a - b)[0] : null;
        }

        async function fetchBangchakOilPrices() {
            const targetUrl = 'https://oil-price.bangchak.co.th/ApiOilPrice2/th';
            const data = await fetchJsonFromCandidates(getProxyUrls(targetUrl), 15000);
            const rows = getBangchakRows(data);
            if (rows.length === 0) throw new Error('บางจากไม่มีรายการราคาที่อ่านได้');

            const dieselCandidates = [];
            rows.forEach(row => {
                const rawName = row?.OilName || row?.Name || row?.name || '';
                const name = normalizeFuelText(rawName);
                const price = bangchakPrice(row);
                if (!Number.isFinite(price)) return;

                if (name.includes('ดีเซล') || name.includes('diesel')) {
                    dieselCandidates.push({ name: rawName, price });
                }
            });

            const selectedDiesel = selectRegularDieselFromNamedCandidates(dieselCandidates);
            const regularDieselPrice = selectedDiesel.primary;
            const alternateDieselPrice = selectedDiesel.alternate;

            const priceMap = {
                'diesel': regularDieselPrice,
                'e85': findBangchakPrice(rows, 'e85'),
                'e20': findBangchakPrice(rows, 'e20'),
                'g95': findBangchakPrice(rows, 'g95'),
                'g91': findBangchakPrice(rows, 'g91')
            };

            // ราคาบางจากเป็นราคากรุงเทพฯ/ยังไม่รวมภาษีบำรุงท้องถิ่น จึงบวก offset เชียงใหม่เหมือนไทยออยล์
            const cmOffset = 0.7;
            Object.keys(priceMap).forEach(key => {
                if (Number.isFinite(priceMap[key])) priceMap[key] += cmOffset;
            });
            const dieselPrimary = Number.isFinite(regularDieselPrice) ? regularDieselPrice + cmOffset : null;
            const dieselAlternate = Number.isFinite(alternateDieselPrice) ? alternateDieselPrice + cmOffset : null;

            if (!hasAnyPrice(priceMap)) throw new Error('บางจากไม่มีราคาที่อ่านได้');

            return {
                sourceName: 'บางจาก',
                sourceNote: '',
                priceMap,
                dieselPrimary,
                dieselAlternate
            };
        }

        function buildPttorSoapEnvelope() {
            return `<?xml version="1.0" encoding="utf-8"?>
<soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
  <soap:Body>
    <CurrentOilPriceProvincial xmlns="http://www.pttor.com">
      <Language>thai</Language>
      <Province>เชียงใหม่</Province>
    </CurrentOilPriceProvincial>
  </soap:Body>
</soap:Envelope>`;
        }

        async function fetchPttorSoapText(url) {
            const soapEnvelope = buildPttorSoapEnvelope();
            const response = await fetchWithTimeout(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/xml; charset=utf-8',
                    'SOAPAction': '"https://orapiweb.pttor.com/CurrentOilPriceProvincial"'
                },
                body: soapEnvelope
            }, 15000);
            if (!response.ok) throw new Error('PTT OR SOAP ไม่ตอบสนอง');
            return await response.text();
        }

        async function fetchPttorRestTextThroughProxy() {
            const restUrl = 'https://orapiweb.pttor.com/oilservice/OilPrice.asmx/CurrentOilPriceProvincial?Language=thai&Province=' + encodeURIComponent('เชียงใหม่');
            try {
                return await fetchTextFromCandidates(getProxyUrls(restUrl), 15000);
            } catch (error) {
                throw new Error('PTT OR REST ผ่านตัวกลางไม่ตอบสนอง');
            }
        }

        function parsePttorRows(xmlText) {
            const outerXml = new DOMParser().parseFromString(xmlText, 'text/xml');
            const parserError = outerXml.getElementsByTagName('parsererror')[0];
            if (parserError) throw new Error('อ่าน XML จาก PTT OR ไม่ได้');

            const resultNode = outerXml.getElementsByTagName('CurrentOilPriceProvincialResult')[0]
                || outerXml.getElementsByTagName('CurrentOilPriceResult')[0];
            let innerXmlText = resultNode ? resultNode.textContent : xmlText;
            innerXmlText = decodeHtmlEntities(innerXmlText).trim();

            const innerXml = new DOMParser().parseFromString(innerXmlText, 'text/xml');
            const fuelNodes = Array.from(innerXml.getElementsByTagName('FUEL'));
            if (fuelNodes.length === 0) throw new Error('ไม่พบรายการ FUEL จาก PTT OR');

            return fuelNodes.map(node => {
                const row = {};
                Array.from(node.children).forEach(child => {
                    row[child.tagName] = child.textContent;
                });
                return row;
            });
        }

        function rowSearchText(row) {
            return normalizeFuelText(Object.entries(row)
                .filter(([key]) => !/price|date|time/i.test(key))
                .map(([, value]) => value)
                .join(' '));
        }

        function rowPrice(row) {
            for (const [key, value] of Object.entries(row)) {
                if (/price|ราคา/i.test(key)) {
                    const num = parsePriceNumber(value);
                    if (Number.isFinite(num)) return num;
                }
            }
            return null;
        }

        function findPttorPrice(rows, fuelId) {
            const candidates = [];
            rows.forEach(row => {
                const text = rowSearchText(row);
                const price = rowPrice(row);
                if (!Number.isFinite(price)) return;

                if (fuelId === 'e85' && (text.includes('e85') || text.includes('แก๊สโซฮอล์e85'))) candidates.push(price);
                if (fuelId === 'e20' && (text.includes('e20') || text.includes('แก๊สโซฮอล์e20'))) candidates.push(price);
                if (fuelId === 'g95' && (text.includes('95') && (text.includes('แก๊สโซฮอล์') || text.includes('gasohol')) && !text.includes('พรีเมียม') && !text.includes('premium') && !text.includes('ซูเปอร์'))) candidates.push(price);
                if (fuelId === 'g91' && (text.includes('91') && (text.includes('แก๊สโซฮอล์') || text.includes('gasohol')) && !text.includes('พรีเมียม') && !text.includes('premium') && !text.includes('ซูเปอร์'))) candidates.push(price);
            });
            return candidates.length ? candidates.sort((a, b) => a - b)[0] : null;
        }

        function extractPttorPrices(xmlText) {
            const rows = parsePttorRows(xmlText);
            const dieselCandidates = [];

            rows.forEach(row => {
                const text = rowSearchText(row);
                const displayName = Object.entries(row)
                    .filter(([key]) => !/price|date|time/i.test(key))
                    .map(([, value]) => value)
                    .join(' ');
                const price = rowPrice(row);
                if (!Number.isFinite(price)) return;
                if (text.includes('ดีเซล') || text.includes('diesel')) dieselCandidates.push({ name: displayName, price });
            });

            const selectedDiesel = selectRegularDieselFromNamedCandidates(dieselCandidates);
            const regularDieselPrice = selectedDiesel.primary;
            const alternateDieselPrice = selectedDiesel.alternate;

            const priceMap = {
                'diesel': regularDieselPrice,
                'e85': findPttorPrice(rows, 'e85'),
                'e20': findPttorPrice(rows, 'e20'),
                'g95': findPttorPrice(rows, 'g95'),
                'g91': findPttorPrice(rows, 'g91')
            };

            if (!hasAnyPrice(priceMap)) throw new Error('PTT OR ไม่มีราคาที่อ่านได้');

            return {
                sourceName: 'ปตท.',
                sourceNote: '',
                priceMap,
                dieselPrimary: regularDieselPrice,
                dieselAlternate: alternateDieselPrice
            };
        }

        async function fetchPttorOilPrices() {
            const endpoint = 'https://orapiweb.pttor.com/oilservice/OilPrice.asmx';
            const proxyEndpoint = 'https://corsproxy.io/?url=' + encodeURIComponent(endpoint);
            const errors = [];

            try {
                const xmlText = await fetchPttorSoapText(endpoint);
                return extractPttorPrices(xmlText);
            } catch (error) {
                errors.push(error.message);
            }

            try {
                const xmlText = await fetchPttorSoapText(proxyEndpoint);
                return extractPttorPrices(xmlText);
            } catch (error) {
                errors.push(error.message);
            }

            try {
                const xmlText = await fetchPttorRestTextThroughProxy();
                return extractPttorPrices(xmlText);
            } catch (error) {
                errors.push(error.message);
            }

            throw new Error('PTT OR fallback ใช้งานไม่ได้: ' + errors.join(' / '));
        }

        function applyFetchedOilPrices(result) {
            fetchedDieselPrices.primary = result.dieselPrimary;
            fetchedDieselPrices.alternate = result.dieselAlternate;
            fetchedDieselPrices.using = 'primary';

            let updatedCount = 0;
            fuels.forEach(fuel => {
                const priceValue = result.priceMap[fuel.id];
                if (Number.isFinite(priceValue)) {
                    document.getElementById(`old_${fuel.id}`).value = priceValue.toFixed(2);
                    calculateDiff(fuel.id, true);
                    updatedCount++;
                }
            });

            updateDieselSourceSwapButton();
            saveData();
            return updatedCount;
        }

                console.error('Fetch error:', error);
                const errorSourceLabel = sourceKey === 'auto' ? 'แหล่งข้อมูลทั้งหมด' : sourceLabel;
                showModal('ข้อผิดพลาด', 'ไม่สามารถดึงข้อมูลจาก ' + errorSourceLabel + ' ได้ในขณะนี้\nกรุณาเลือกแหล่งข้อมูลอื่น หรือกรอกราคาเดิมด้วยตนเองครับ');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                updateOilSourceButtons();
            }
        }

        // ระบบ Custom Modal
        function showModal(title, message, type = 'alert', onConfirm = null) {
            const modal = document.getElementById('customModal');
            const modalContent = document.getElementById('customModalContent');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            
            const btnContainer = document.getElementById('modalButtons');
            if (type === 'confirm') {
                btnContainer.innerHTML = `
                    <button onclick="closeModal()" class="px-4 py-2 text-gray-600 font-bold bg-gray-100 hover:bg-gray-200 rounded-lg text-sm transition-colors">ยกเลิก</button>
                    <button id="confirmActionBtn" class="px-4 py-2 text-white font-bold bg-red-500 hover:bg-red-600 rounded-lg text-sm transition-colors">ยืนยันการล้าง</button>
                `;
                document.getElementById('confirmActionBtn').onclick = () => { closeModal(); if(onConfirm) onConfirm(); };
            } else {
                btnContainer.innerHTML = `<button onclick="closeModal()" class="px-4 py-2 text-white font-bold bg-blue-600 hover:bg-blue-700 rounded-lg text-sm transition-colors">ตกลง</button>`;
            }
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            const modalContent = document.getElementById('customModalContent');
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function clearAllData() {
            showModal('ยืนยันการล้างข้อมูล', 'คุณต้องการลบตัวเลขทั้งหมดที่กรอกไว้ใช่หรือไม่?', 'confirm', () => {
                localStorage.removeItem('oilPriceData');
                fuels.forEach(fuel => {
                    document.getElementById(`old_${fuel.id}`).value = '';
                    document.getElementById(`new_${fuel.id}`).value = '';
                    document.getElementById(`diff_${fuel.id}`).value = '';
                    calculateDiff(fuel.id, true);
                });
                saveData();
                const previewSection = document.getElementById('previewSection');
                if (previewSection) previewSection.classList.add('hidden');
            });
        }

        function swapPrices(id) {
            const oldInput = document.getElementById(`old_${id}`);
            const newInput = document.getElementById(`new_${id}`);
            const temp = oldInput.value;
            oldInput.value = newInput.value;
            newInput.value = temp;
            
            if(oldInput.value) oldInput.value = parseFloat(oldInput.value).toFixed(2);
            if(newInput.value) newInput.value = parseFloat(newInput.value).toFixed(2);
            calculateDiff(id);
        }

        function formatPriceOnBlur(id, type) {
            const input = document.getElementById(`${type}_id`);
            // แก้ไข bug เดิมที่เรียกผิด id ให้ถูกต้อง
            const realInput = document.getElementById(`${type}_${id}`);
            let val = parseFloat(realInput.value);
            if (!isNaN(val)) realInput.value = val.toFixed(2);
            calculateDiff(id);
        }

        function formatDiffOnBlur(id) {
            const diffInput = document.getElementById(`diff_${id}`);
            let val = diffInput.value;
            let cleanVal = val.replace(/[^\d.-]/g, '');
            if (cleanVal === "" || isNaN(parseFloat(cleanVal))) {
                diffInput.value = "-";
                diffInput.className = "w-full bg-gray-100 border border-gray-200 text-center font-bold rounded-lg p-2 outline-none";
                return;
            }
            let num = parseFloat(cleanVal);
            if (num === 0) {
                diffInput.value = "-";
                diffInput.className = "w-full bg-gray-100 border border-gray-200 text-center font-bold rounded-lg p-2 outline-none";
            } else {
                const prefix = num > 0 ? "+" : "";
                diffInput.value = prefix + num.toFixed(2);
            }
        }

        function handleDiffInput(id) {
            const diffInput = document.getElementById(`diff_${id}`);
            const oldVal = parseFloat(document.getElementById(`old_${id}`).value);
            const newVal = parseFloat(document.getElementById(`new_${id}`).value);
            let val = diffInput.value;
            if (val !== "" && /^[0-9.]/.test(val)) { diffInput.value = "+" + val; val = "+" + val; }
            let cleanVal = val.replace(/[^\d.-]/g, '');
            if (cleanVal === "" || cleanVal === "-" || cleanVal === "+") {
                diffInput.className = "w-full bg-gray-100 border border-gray-200 text-center font-bold rounded-lg p-2 outline-none";
                return;
            }
            let diffNum = parseFloat(cleanVal);
            if (!isNaN(diffNum)) {
                if (!isNaN(oldVal)) {
                    document.getElementById(`new_${id}`).value = (oldVal + diffNum).toFixed(2);
                } else if (!isNaN(newVal)) {
                    document.getElementById(`old_${id}`).value = (newVal - diffNum).toFixed(2);
                }
                if (diffNum > 0) diffInput.className = "w-full bg-red-50 border border-red-300 text-center font-bold text-red-600 rounded-lg p-2 outline-none";
                else if (diffNum < 0) diffInput.className = "w-full bg-green-50 border border-green-300 text-center font-bold text-green-500 rounded-lg p-2 outline-none";
                else diffInput.className = "w-full bg-gray-100 border border-gray-300 text-center font-bold text-gray-600 rounded-lg p-2 outline-none";
            }
            saveData();
        }

        function calculateDiff(id, skipSave = false) {
            const oldVal = parseFloat(document.getElementById(`old_${id}`).value);
            const newVal = parseFloat(document.getElementById(`new_${id}`).value);
            const diffInput = document.getElementById(`diff_${id}`);

            if (!isNaN(oldVal) && !isNaN(newVal)) {
                const diff = newVal - oldVal;
                let formattedDiff = Math.abs(diff).toFixed(2); 
                if (diff > 0) {
                    diffInput.value = "+\u200A" + formattedDiff;
                    diffInput.className = "w-full bg-red-50 border border-red-300 text-center font-bold text-red-600 rounded-lg p-2 outline-none";
                } else if (diff < 0) {
                    diffInput.value = "-\u200A" + formattedDiff;
                    diffInput.className = "w-full bg-green-50 border border-green-300 text-center font-bold text-green-500 rounded-lg p-2 outline-none";
                } else {
                    diffInput.value = "-"; 
                    diffInput.className = "w-full bg-gray-100 border border-gray-300 text-center font-bold text-gray-600 rounded-lg p-2 outline-none";
                }
            } else {
                diffInput.value = "";
                diffInput.className = "w-full bg-gray-100 border border-gray-200 text-center font-bold rounded-lg p-2 outline-none";
            }
            if (!skipSave) saveData(); 
        }

        function saveData() {
            const data = { fuels: {} };
            fuels.forEach(fuel => {
                data.fuels[fuel.id] = {
                    old: document.getElementById(`old_${fuel.id}`).value,
                    new: document.getElementById(`new_${fuel.id}`).value
                };
            });
            localStorage.setItem('oilPriceData', JSON.stringify(data));
        }

        function loadData() {
            try {
                const saved = localStorage.getItem('oilPriceData');
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.fuels) {
                        fuels.forEach(fuel => {
                            if (data.fuels[fuel.id]) {
                                document.getElementById(`old_${fuel.id}`).value = data.fuels[fuel.id].old || '';
                                document.getElementById(`new_${fuel.id}`).value = data.fuels[fuel.id].new || '';
                                calculateDiff(fuel.id, true); 
                            }
                        });
                    }
                }
            } catch (e) { console.warn('Error loading data', e); }
        }

        function setupEnterNavigation() {
            const inputs = Array.from(document.querySelectorAll('input[type="text"]:not([readonly]), input[type="number"]'));
            inputs.forEach((input, index) => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault(); 
                        const nextInput = inputs[index + 1];
                        if (nextInput) { nextInput.focus(); nextInput.select(); }
                        else { if (!document.getElementById('generateBtn').disabled) generatePreview(); }
                    }
                });
            });
        }

        // --- แยกฟังก์ชันการวาดรูปแบบเร็ว (สำหรับเวลาเลื่อนสไลเดอร์) ---
        async function drawCanvasFast() {
            const baseImg = document.getElementById('baseImage');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            if (!baseImg.complete || baseImg.naturalWidth === 0) return;

            const width = baseImg.naturalWidth;
            const height = baseImg.naturalHeight;
            canvas.width = width;
            canvas.height = height;
            
            ctx.drawImage(baseImg, 0, 0, width, height);

            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const iosVerticalOffset = isIOS ? 5 : 0; 

            // 1. วาดวันที่ (วิธีใหม่ แก้ปัญหา iOS 100%)
            const dateText = document.getElementById('dateTimeText').value;
            const dateY = (height * 0.130) - iosVerticalOffset; 
            
            // ดึงค่าแกน X จากสไลเดอร์มาใช้แทนค่าคงที่
            const sliderValue = parseFloat(document.getElementById('dateXSlider').value);
            const dateXCenter = width * sliderValue; 
            
            // ใช้ textAlign = 'left' แล้วคำนวณตำแหน่งกลางด้วยตัวเอง เพื่อแก้บั๊ก iOS
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.font = `bold ${(width * 0.045) - 3}px "Prompt", sans-serif`; 
            
            // คำนวณความกว้างข้อความ แล้วเอาไปลบออกจากจุดกึ่งกลาง (หาร 2)
            const textMetrics = ctx.measureText(dateText);
            const actualDateX = dateXCenter - (textMetrics.width / 2);

            ctx.fillStyle = "#ffffff"; 
            ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
            ctx.shadowBlur = 6;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2; 
            
            // วาดที่ตำแหน่งซ้ายที่ถูกคำนวณมาแล้ว
            ctx.fillText(dateText, actualDateX, dateY);
            
            ctx.shadowColor = "transparent";
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // 2. ตำแหน่งคอลัมน์และราคาน้ำมัน
            const colOldX = width * posX.oldPrice;   
            const colDiffX = width * posX.newPrice;  
            const colNewX = width * posX.diff;       
            const priceFontSize = (width * 0.082) - 20; 
            
            ctx.textAlign = "center"; // ราคาน้ำมันกลับมาใช้ center ได้ตามปกติ

            fuels.forEach(fuel => {
                const oldVal = document.getElementById(`old_${fuel.id}`).value;
                const newVal = document.getElementById(`new_${fuel.id}`).value;
                const diffVal = document.getElementById(`diff_${fuel.id}`).value;
                const diffNum = parseFloat(diffVal.replace(/[+\u200A]/g, '').trim());
                
                const yPos = (height * fuel.yPos) - iosVerticalOffset + (fuel.offsetY || 0);

                let drawFontSize = priceFontSize;
                if (!isNaN(diffNum) && Math.abs(diffNum) >= 10) {
                    drawFontSize = priceFontSize - 6; 
                }

                if(oldVal) {
                    ctx.font = `bold ${priceFontSize}px "Prompt", sans-serif`;
                    ctx.fillStyle = "#000000"; 
                    ctx.fillText(parseFloat(oldVal).toFixed(2), colOldX, yPos);
                }
                
                if(diffVal && diffVal !== "-") {
                    ctx.font = `bold ${drawFontSize}px "Prompt", sans-serif`;
                    let cleanDisplay = diffVal.replace(/\u200A/g, ''); 
                    
                    if(cleanDisplay.includes('+')) {
                        ctx.fillStyle = "#e60000"; 
                    } else if (cleanDisplay.includes('-')) {
                        ctx.fillStyle = "#1b882e"; 
                    } else {
                        ctx.fillStyle = "#000000";
                    }
                    ctx.fillText(cleanDisplay, colDiffX, yPos); 
                } else if (diffVal === "-" || (oldVal && !diffVal)) {
                    ctx.font = `bold ${priceFontSize}px "Prompt", sans-serif`;
                    ctx.fillStyle = "#888888"; 
                    ctx.fillText("-", colDiffX, yPos); 
                }
                
                if(newVal) {
                    ctx.font = `bold ${priceFontSize}px "Prompt", sans-serif`;
                    ctx.fillStyle = "#ffffff"; 
                    
                    ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
                    ctx.shadowBlur = 4;
                    ctx.shadowOffsetX = 2;
                    ctx.shadowOffsetY = 2;
                    
                    ctx.fillText(parseFloat(newVal).toFixed(2), colNewX, yPos); 
                    
                    ctx.shadowColor = "transparent";
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                } else if (oldVal) {
                    ctx.font = `bold ${priceFontSize}px "Prompt", sans-serif`;
                    ctx.fillStyle = "#ffffff"; 
                    
                    ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
                    ctx.shadowBlur = 4;
                    ctx.shadowOffsetX = 2;
                    ctx.shadowOffsetY = 2;
                    
                    ctx.fillText("-", colNewX, yPos); 
                    
                    ctx.shadowColor = "transparent";
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                }
            });
        }

        // --- ส่วนการสร้างรูปลง Canvas (หลัก) ---
        async function generatePreview() {
            const btn = document.getElementById('generateBtn');
            const originalText = btn.innerHTML;
            
            // แสดงสถานะกำลังโหลด
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังสร้างรูปภาพ...`;
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            setTimeout(async () => {
                try {
                    await document.fonts.ready;
                    const baseImg = document.getElementById('baseImage');
                    
                    if (!baseImg.complete || baseImg.naturalWidth === 0) { 
                        showModal('แจ้งเตือน', 'ภาพต้นฉบับ (กรอบ) ยังโหลดไม่สำเร็จ \nโปรดรอสักครู่ เช็คอินเทอร์เน็ต หรือใช้วิธี "อัปโหลดภาพต้นฉบับ" แทนครับ'); 
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                        btn.classList.remove('opacity-75', 'cursor-not-allowed');
                        return; 
                    }

                    // เรียกใช้ฟังก์ชันวาดรูป
                    await drawCanvasFast();

                    const previewSection = document.getElementById('previewSection');
                    previewSection.classList.remove('hidden');
                    // เลื่อนหน้าจอลงมาหา "รูปตัวอย่าง" ตามปกติ (ไม่เด้งขึ้นบน)
                    previewSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } catch (error) { 
                    console.warn(error); 
                    showModal("ข้อผิดพลาด", "เกิดข้อผิดพลาดในการสร้างรูปภาพ (โปรดรอฟอนต์หรือภาพโหลดสักครู่)"); 
                } finally {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    btn.classList.remove('opacity-75', 'cursor-not-allowed');
                }
            }, 50);
        }

        function downloadImage() {
            try {
                const canvas = document.getElementById('canvas');
                // บันทึกที่คุณภาพ 100% (1.0)
                const dataURL = canvas.toDataURL('image/jpeg', 1.0);
                const link = document.createElement('a');
                const dateStr = new Date().toISOString().slice(0,10);
                link.download = `oil-price-update-${dateStr}.jpg`;
                link.href = dataURL;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) { showModal("ข้อผิดพลาด", "เกิดข้อผิดพลาดในการบันทึกภาพ"); }
        }

        window.onload = () => {
            setTomorrowDate(); 
            loadData();             
            updateOilSourceButtons();
            setupEnterNavigation(); 
            document.getElementById('imageUpload').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const baseImg = document.getElementById('baseImage');
                        baseImg.onload = function() { showModal('สำเร็จ', 'อัปโหลดภาพสำเร็จ!'); };
                        baseImg.removeAttribute('crossorigin'); 
                        baseImg.src = event.target.result;
                    }
                    reader.readAsDataURL(file);
                }
            });
        };
    </script>
