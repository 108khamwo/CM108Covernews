<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ศูนย์รวมระบบรายงานระดับน้ำปิง — 3 รูปแบบ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#082d6c;--blue:#0a63d8;--blue2:#0b8df0;--green:#078b49;
      --text:#14345d;--muted:#647c99;--line:#d4e5f6;--panel:#fff;
      --shadow:0 18px 55px rgba(10,63,126,.16)
    }
    *{box-sizing:border-box}
    html,body,button{font-family:"Prompt",Tahoma,"Noto Sans Thai",Arial,sans-serif}
    body{margin:0;min-height:100vh;color:var(--text);background:linear-gradient(135deg,#e8f4ff 0%,#f8fbff 48%,#edf7ff 100%)}
    .shell{width:min(1180px,100%);margin:0 auto;padding:14px}
    .topbar{position:relative;z-index:1;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
    .topgrid{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
    h1{margin:0;color:var(--navy);font-size:clamp(21px,3vw,29px);line-height:1.25}
    .sub{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.55}
    #fetchAllBtn{min-width:240px;min-height:54px;border:0;border-radius:14px;padding:12px 18px;color:#fff;background:linear-gradient(135deg,#079852,#05733f);box-shadow:0 10px 25px rgba(5,117,63,.24);font:800 15px/1.2 inherit;cursor:pointer}
    #fetchAllBtn:hover{filter:brightness(1.04)}
    #fetchAllBtn:active{transform:translateY(1px)}
    #fetchAllBtn[disabled]{cursor:wait;opacity:.68;filter:grayscale(.15)}
    .global-status{display:flex;gap:9px;align-items:flex-start;margin-top:12px;padding:10px 12px;border:1px solid #d8e6f4;border-radius:12px;background:#f9fcff;color:#536e8c;font-size:12px;line-height:1.5}
    .global-status .dot{width:10px;height:10px;margin-top:4px;border-radius:50%;background:#879db5;flex:0 0 auto}
    .global-status strong{display:block;color:#183f70;margin-bottom:2px}
    .global-status.loading .dot{background:#e98a00;box-shadow:0 0 0 4px rgba(233,138,0,.12)}
    .global-status.success .dot{background:#06964e;box-shadow:0 0 0 4px rgba(6,150,78,.12)}
    .global-status.warning .dot{background:#e98a00;box-shadow:0 0 0 4px rgba(233,138,0,.12)}
    .global-status.error .dot{background:#df2734;box-shadow:0 0 0 4px rgba(223,39,52,.12)}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 10px 34px rgba(9,62,128,.10);margin-bottom:12px}
    .tab{border:0;border-radius:12px;padding:11px 8px;color:#315b89;background:#eaf4ff;font:700 13px/1.3 inherit;cursor:pointer}
    .tab.active{color:#fff;background:linear-gradient(135deg,var(--blue2),var(--blue));box-shadow:0 8px 20px rgba(5,86,196,.22)}
    .panel{display:none}
    .panel.active{display:block}
    iframe{display:block;width:100%;min-height:900px;border:0;border-radius:18px;background:transparent}
    .footnote{text-align:center;color:#71869e;font-size:11px;line-height:1.5;padding:8px 10px 18px}
    @media(max-width:720px){
      .shell{padding:7px}.topbar{border-radius:17px;padding:12px}.topgrid{grid-template-columns:1fr}.sub{font-size:12px}#fetchAllBtn{width:100%;min-width:0}.tabs{gap:5px;padding:6px}.tab{font-size:11.5px;padding:10px 5px;border-radius:10px}iframe{border-radius:12px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div class="topgrid">
        <div>
          <h1>ศูนย์รวมระบบรายงานระดับน้ำปิง</h1>
        </div>
        <button id="fetchAllBtn" type="button" disabled>กำลังโหลดทั้ง 3 ระบบ…</button>
      </div>
      <div class="global-status" id="globalStatus" role="status" aria-live="polite">
        <span class="dot"></span><div><strong>พร้อมใช้งาน</strong><span>เลือกแท็บเพื่อใช้งานแต่ละรูปแบบ แล้วกดดึงข้อมูลเพียงครั้งเดียว</span></div>
      </div>
    </section>

    <nav class="tabs" aria-label="เลือกรูปแบบรายงาน">
      <button class="tab active" type="button" data-index="0">P.1</button>
      <button class="tab" type="button" data-index="1">2 จุด แบบกราฟ</button>
      <button class="tab" type="button" data-index="2">2 จุด แบบตาราง</button>
    </nav>

    <section class="panel active"><iframe id="systemFrame0" title="ระบบรายงานระดับน้ำปิง P.1"></iframe></section>
    <section class="panel"><iframe id="systemFrame1" title="ระบบรายงานระดับน้ำปิง 2 จุด แบบกราฟ"></iframe></section>
    <section class="panel"><iframe id="systemFrame2" title="ระบบรายงานระดับน้ำปิง 2 จุด แบบตาราง"></iframe></section>

  </main>

<script>
(() => {
  'use strict';
  // GitHub Pages: โหลดระบบย่อยและรูปพื้นหลังเป็นไฟล์แยก เพื่อลดขนาด index.html
  const SYSTEMS = [{"label": "ระบบ P.1", "src": "systems/p1.html"}, {"label": "2 จุด — แบบกราฟ", "src": "systems/two-point-graph.html"}, {"label": "2 จุด — แบบตาราง", "src": "systems/two-point-table.html"}];
  const FIXED_WORKER_URL = 'https://ping-water.108khamwo.workers.dev';
  const frames = SYSTEMS.map((_, index) => document.getElementById(`systemFrame${index}`));
  const panels = [...document.querySelectorAll('.panel')];
  const tabs = [...document.querySelectorAll('.tab')];
  const fetchAllBtn = document.getElementById('fetchAllBtn');
  const globalStatus = document.getElementById('globalStatus');
  const sharedPayloads = new Map();
  const sharedErrors = new Map();
  const frameResizeStates = new WeakMap();
  let framesReady = 0;

  function normalizeStation(value) {
    const compact = String(value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (compact === 'P1') return 'P.1';
    if (compact === 'P67') return 'P.67';
    return String(value || '').toUpperCase();
  }

  function getBangkokCurrentHour() {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Bangkok',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(new Date());
    const get = type => parts.find(part => part.type === type)?.value || '';
    return { date: `${get('year')}-${get('month')}-${get('day')}`, time: `${get('hour')}:00` };
  }

  function formatThaiWarningDate(dateString) {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateString || ''));
    if (!match) return String(dateString || '-');
    const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    return `${Number(match[3])} ${months[Number(match[2]) - 1]} ${Number(match[1]) + 543}`;
  }

  function formatWarningTime(timeString) {
    return String(timeString || '').slice(0, 5).replace(':', '.');
  }

  function setGlobalStatus(type, title, detail) {
    globalStatus.className = `global-status ${type || ''}`.trim();
    globalStatus.innerHTML = `<span class="dot"></span><div><strong>${title}</strong><span>${detail || ''}</span></div>`;
  }

  function getWorkerBase() {
    try {
      const editable = frames[1].contentDocument?.getElementById('workerUrl')?.value?.trim();
      if (editable && /^https?:\/\//i.test(editable)) return editable;
    } catch (_) {}
    return FIXED_WORKER_URL;
  }

  function buildDataUrl(base, station) {
    const url = new URL(base, location.href);
    url.searchParams.set('station', station);
    url.searchParams.set('source', 'auto');
    url.searchParams.set('history_hours', '9');
    url.searchParams.set('allow_stale', '0');
    url.searchParams.set('max_age', '180');
    url.searchParams.set('_t', String(Date.now()));
    return url;
  }

  async function requestStation(base, station) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 35000);
    try {
      const response = await window.fetch(buildDataUrl(base, station).toString(), { cache: 'no-store', signal: controller.signal });
      let data;
      try { data = await response.json(); }
      catch (_) { throw new Error(`คำตอบไม่ใช่ JSON (HTTP ${response.status})`); }
      if (!response.ok || !data?.ok) throw new Error(data?.error || `HTTP ${response.status}`);
      const returned = normalizeStation(data.station || data.station_code || data.code || station);
      if (returned && returned !== normalizeStation(station)) throw new Error(`ต้นทางส่งข้อมูล ${returned} แทน ${station}`);
      return data;
    } finally {
      clearTimeout(timeout);
    }
  }

  function makeCachedResponse(station) {
    if (sharedPayloads.has(station)) {
      return new Response(JSON.stringify(sharedPayloads.get(station)), {
        status: 200,
        headers: { 'Content-Type': 'application/json; charset=utf-8', 'X-Shared-Water-Data': '1' }
      });
    }
    const message = sharedErrors.get(station) || `ไม่มีข้อมูล ${station} จากการดึงข้อมูลครั้งนี้`;
    return new Response(JSON.stringify({ ok: false, error: message, station }), {
      status: 502,
      headers: { 'Content-Type': 'application/json; charset=utf-8', 'X-Shared-Water-Data': '1' }
    });
  }

  function installFrameHeightFix(frame, win, doc) {
    if (!doc.getElementById('__hubHeightFix')) {
      const style = doc.createElement('style');
      style.id = '__hubHeightFix';
      style.textContent = `
        html, body {
          min-height: 0 !important;
          height: auto !important;
        }
      `;
      (doc.head || doc.documentElement).appendChild(style);
    }

    frame.setAttribute('scrolling', 'no');
    const root = doc.querySelector('main.app') || doc.body;
    const state = { pending: false, lastHeight: 0, observer: null, resize: null };

    const resize = () => {
      if (state.pending || !frame.isConnected) return;
      if (frame.getBoundingClientRect().width < 1) return;
      state.pending = true;
      const requestFrame = win.requestAnimationFrame?.bind(win) || window.requestAnimationFrame.bind(window);
      requestFrame(() => {
        state.pending = false;
        try {
          const rootRect = root.getBoundingClientRect();
          let top = rootRect.top;
          let bottom = rootRect.bottom;

          for (const child of doc.body.children) {
            if (child.tagName === 'SCRIPT' || child.tagName === 'STYLE') continue;
            const rect = child.getBoundingClientRect();
            if (rect.width || rect.height) {
              top = Math.min(top, rect.top);
              bottom = Math.max(bottom, rect.bottom);
            }
          }

          const contentHeight = Math.max(root.scrollHeight || 0, bottom - top);
          const targetHeight = Math.max(900, Math.ceil(contentHeight));
          if (Math.abs(targetHeight - state.lastHeight) > 1) {
            state.lastHeight = targetHeight;
            frame.style.height = `${targetHeight}px`;
          }
        } catch (_) {}
      });
    };

    state.resize = resize;
    frameResizeStates.set(frame, state);
    resize();

    if (win.ResizeObserver && root) {
      state.observer = new win.ResizeObserver(resize);
      state.observer.observe(root);
    }
    win.addEventListener('resize', resize, { passive: true });
    setTimeout(resize, 250);
    setTimeout(resize, 1000);
    setTimeout(resize, 2200);
  }

  function resizeFrame(frame) {
    const state = frameResizeStates.get(frame);
    if (state?.resize) state.resize();
  }

  function installGraphManualPrompts(frame) {
    const doc = frame.contentDocument;
    if (!doc || doc.getElementById('hubGraphManualPrompts')) return;

    const style = doc.createElement('style');
    style.id = 'hubGraphManualPromptStyle';
    style.textContent = `
      #hubGraphManualPrompts { display:grid; gap:10px; margin-top:12px; }
      #hubGraphManualPrompts:empty { display:none; }
      .hub-graph-manual { border:1px solid #f1c36b; background:#fff9e9; border-radius:15px; padding:13px; }
      .hub-graph-manual[hidden] { display:none !important; }
      .hub-graph-manual strong { display:block; color:#8a5700; margin-bottom:4px; }
      .hub-graph-manual p { margin:0 0 10px; color:#755d2d; font-size:13px; line-height:1.5; }
      .hub-graph-manual-form { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:end; }
      .hub-graph-manual-form label { display:block; font-size:12px; font-weight:700; margin-bottom:5px; color:#70541e; }
      .hub-graph-manual-form input { width:100%; min-width:0; padding:10px 11px; border:1px solid #dcb665; border-radius:10px; background:#fff; color:#183b66; font:inherit; font-size:13px; outline:none; }
      .hub-graph-manual-form input:focus { border-color:#e78b00; box-shadow:0 0 0 3px rgba(231,139,0,.13); }
      .hub-graph-manual-submit { min-width:145px; height:43px; color:#fff; background:linear-gradient(135deg,#e78b00,#bd6700); }
      .hub-graph-manual-error { min-height:17px; margin-top:7px; color:#c32936; font-size:11.5px; }
      @media (max-width:640px) {
        .hub-graph-manual-form { grid-template-columns:1fr; }
        .hub-graph-manual-submit { width:100%; }
      }
    `;
    (doc.head || doc.documentElement).appendChild(style);

    const container = doc.createElement('div');
    container.id = 'hubGraphManualPrompts';
    container.innerHTML = `
      <div class="hub-graph-manual" id="hubGraphManualP67" hidden>
        <strong>ข้อมูล P.67 ยังไม่ถึงเวลาปัจจุบัน</strong>
        <p id="hubGraphManualP67Text">กรอกระดับน้ำล่าสุดด้วยตนเอง ระบบจะเลื่อนข้อมูลย้อนหลังและคำนวณการเปลี่ยนแปลงให้อัตโนมัติ</p>
        <div class="hub-graph-manual-form">
          <div><label for="hubGraphManualP67Value">ระดับน้ำปัจจุบัน (เมตร)</label><input id="hubGraphManualP67Value" type="number" min="0" step="0.01" inputmode="decimal" placeholder="เช่น 2.35"></div>
          <button class="hub-graph-manual-submit" id="hubGraphManualP67Submit" type="button">ยืนยันข้อมูล</button>
        </div>
        <div class="hub-graph-manual-error" id="hubGraphManualP67Error"></div>
      </div>
      <div class="hub-graph-manual" id="hubGraphManualP1" hidden>
        <strong>ข้อมูล P.1 ยังไม่ถึงเวลาปัจจุบัน</strong>
        <p id="hubGraphManualP1Text">กรอกระดับน้ำล่าสุดด้วยตนเอง ระบบจะเลื่อนข้อมูลย้อนหลังและคำนวณการเปลี่ยนแปลงให้อัตโนมัติ</p>
        <div class="hub-graph-manual-form">
          <div><label for="hubGraphManualP1Value">ระดับน้ำปัจจุบัน (เมตร)</label><input id="hubGraphManualP1Value" type="number" min="0" step="0.01" inputmode="decimal" placeholder="เช่น 2.80"></div>
          <button class="hub-graph-manual-submit" id="hubGraphManualP1Submit" type="button">ยืนยันข้อมูล</button>
        </div>
        <div class="hub-graph-manual-error" id="hubGraphManualP1Error"></div>
      </div>
    `;

    const status = doc.getElementById('fetchStatus');
    if (status) status.insertAdjacentElement('afterend', container);
    else (doc.querySelector('.controls') || doc.body).prepend(container);

    const submit = key => {
      const upper = key === 'p67' ? 'P67' : 'P1';
      const input = doc.getElementById(`hubGraphManual${upper}Value`);
      const errorEl = doc.getElementById(`hubGraphManual${upper}Error`);
      const value = Number(input?.value);
      if (!Number.isFinite(value) || value < 0 || value > 10) {
        if (errorEl) errorEl.textContent = 'กรุณากรอกตัวเลขระดับน้ำที่ถูกต้อง';
        input?.focus();
        return;
      }

      const manualButton = doc.getElementById(`${key}ManualBtn`);
      const latestInput = doc.getElementById(`${key}_latest`);
      if (!manualButton || !latestInput) {
        if (errorEl) errorEl.textContent = 'ไม่พบช่องข้อมูลของระบบ กรุณาโหลดหน้าใหม่';
        return;
      }

      manualButton.click();
      latestInput.value = value.toFixed(2);
      latestInput.dispatchEvent(new frame.contentWindow.Event('input', { bubbles:true }));
      latestInput.dispatchEvent(new frame.contentWindow.Event('change', { bubbles:true }));

      const box = doc.getElementById(`hubGraphManual${upper}`);
      if (box) box.hidden = true;
      if (errorEl) errorEl.textContent = '';
      if (input) input.value = '';
      setTimeout(() => resizeFrame(frame), 50);
      setTimeout(() => resizeFrame(frame), 300);
    };

    ['p67','p1'].forEach(key => {
      const upper = key === 'p67' ? 'P67' : 'P1';
      doc.getElementById(`hubGraphManual${upper}Submit`)?.addEventListener('click', () => submit(key));
      doc.getElementById(`hubGraphManual${upper}Value`)?.addEventListener('keydown', event => {
        if (event.key === 'Enter') submit(key);
      });
    });
  }

  function graphPayloadIssue(data) {
    const levels = Array.isArray(data?.levels) ? data.levels : [];
    const valid = levels
      .filter(point => /^\d{4}-\d{2}-\d{2}$/.test(String(point?.date || '')) && /^\d{2}:\d{2}/.test(String(point?.time || '')) && Number.isFinite(Number(point?.level)))
      .map(point => ({ date:String(point.date), time:String(point.time).slice(0,5), level:Number(point.level) }))
      .sort((a,b) => `${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));

    if (Number.isFinite(Number(data?.history_hours)) && Number(data.history_hours) < 8) return 'ข้อมูลย้อนหลังไม่ถึง 8 ชั่วโมง';
    const deduped = [];
    const seen = new Set();
    valid.forEach(point => {
      const key = `${point.date}T${point.time}`;
      if (!seen.has(key)) { seen.add(key); deduped.push(point); }
    });
    const points = deduped.slice(-9);
    if (!points.length) return 'ไม่พบข้อมูลรายชั่วโมงล่าสุด';

    const latestPoint = points[points.length - 1];
    const target = getBangkokCurrentHour();
    const latestKey = `${latestPoint.date}T${latestPoint.time}`;
    const targetKey = `${target.date}T${target.time}`;
    if (latestKey < targetKey) {
      return `ข้อมูลยังไม่ใช่ล่าสุด • ต้นทางล่าสุด ${formatThaiWarningDate(latestPoint.date)} เวลา ${formatWarningTime(latestPoint.time)} น. • ควรมีข้อมูลเวลา ${formatWarningTime(target.time)} น.`;
    }

    if (points.length < 9) return `ข้อมูลรายชั่วโมงไม่ครบ พบ ${points.length} จุด`;

    for (let i = 1; i < points.length; i += 1) {
      const previous = new Date(`${points[i - 1].date}T${points[i - 1].time}:00+07:00`).getTime();
      const current = new Date(`${points[i].date}T${points[i].time}:00+07:00`).getTime();
      const diffMinutes = Math.round((current - previous) / 60000);
      if (!Number.isFinite(diffMinutes) || diffMinutes < 50 || diffMinutes > 70) return 'ช่วงเวลาข้อมูลไม่ต่อเนื่องรายชั่วโมง';
    }

    const latest = points[8].level;
    if (!Number.isFinite(latest) || latest < -2 || latest > 10) return 'ค่าระดับน้ำล่าสุดผิดปกติ';
    if (Number.isFinite(Number(data?.latest)) && Math.abs(Number(data.latest) - latest) > 0.001) return 'ค่าล่าสุดไม่ตรงกับข้อมูลรายชั่วโมง';
    return '';
  }

  function collectGraphManualIssues() {
    const issues = new Map();
    ['P.67','P.1'].forEach(station => {
      if (!sharedPayloads.has(station)) {
        issues.set(station, sharedErrors.get(station) || 'ไม่มีข้อมูลล่าสุดจากต้นทาง');
        return;
      }
      const issue = graphPayloadIssue(sharedPayloads.get(station));
      if (issue) issues.set(station, issue);
    });
    return issues;
  }

  function updateGraphManualPrompts(issues) {
    const frame = frames[1];
    const doc = frame?.contentDocument;
    if (!doc) return;
    installGraphManualPrompts(frame);

    [['P.67','P67'],['P.1','P1']].forEach(([station, upper]) => {
      const box = doc.getElementById(`hubGraphManual${upper}`);
      const text = doc.getElementById(`hubGraphManual${upper}Text`);
      const error = doc.getElementById(`hubGraphManual${upper}Error`);
      const shouldShow = issues?.has(station);
      if (box) box.hidden = !shouldShow;
      if (text && shouldShow) text.textContent = `${issues.get(station)} — กรุณากรอกระดับน้ำล่าสุด ระบบจะเลื่อนข้อมูลย้อนหลังและคำนวณการเปลี่ยนแปลงให้อัตโนมัติ`;
      if (error) error.textContent = '';
    });

    if (issues?.size) {
      const status = doc.getElementById('fetchStatus');
      if (status) {
        status.className = 'fetch-status warning';
        status.replaceChildren();
        const dot = doc.createElement('span');
        dot.className = 'dot';
        const content = doc.createElement('div');
        const title = doc.createElement('strong');
        title.textContent = 'ข้อมูลยังไม่ใช่ล่าสุด';
        const detail = doc.createElement('span');
        detail.textContent = [...issues].map(([station, reason]) => `${station}: ${reason}`).join(' • ');
        content.append(title, detail);
        status.append(dot, content);
      }
    }

    setTimeout(() => resizeFrame(frame), 40);
    setTimeout(() => resizeFrame(frame), 250);
  }

  function patchFrame(frame, index) {
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    if (!win || !doc) return;

    const nativeFetch = win.fetch.bind(win);
    win.fetch = (input, init) => {
      try {
        const raw = typeof input === 'string' ? input : input?.url;
        const url = new URL(raw, win.location.href);
        const station = normalizeStation(url.searchParams.get('station'));
        if (station === 'P.1' || station === 'P.67') return Promise.resolve(makeCachedResponse(station));
      } catch (_) {}
      return nativeFetch(input, init);
    };

    const lead = doc.querySelector('.simple-lead, .lead');
    if (lead) lead.style.display = 'none';
    if (index === 1) installGraphManualPrompts(frame);

    installFrameHeightFix(frame, win, doc);
    framesReady += 1;
    if (framesReady === frames.length) {
      fetchAllBtn.disabled = false;
      fetchAllBtn.textContent = 'ดึงข้อมูลทุกระบบ';
      setGlobalStatus('', 'พร้อมใช้งาน', 'ทั้ง 3 ระบบโหลดเรียบร้อยแล้ว กดดึงข้อมูลเพียงครั้งเดียวเพื่ออัปเดตทุกแท็บ');
    }
  }

  function waitForButton(frame, timeoutMs = 45000) {
    return new Promise(resolve => {
      const startedAt = Date.now();
      const check = () => {
        try {
          const btn = frame.contentDocument?.getElementById('fetchBtn');
          if (btn && !btn.disabled && Date.now() - startedAt > 120) return resolve(true);
        } catch (_) {}
        if (Date.now() - startedAt >= timeoutMs) return resolve(false);
        setTimeout(check, 120);
      };
      check();
    });
  }

  async function triggerAllSystems() {
    const tableDoc = frames[2].contentDocument;
    const displayMode = tableDoc?.getElementById('displayMode');
    const previousMode = displayMode?.value || 'both';
    if (displayMode && previousMode !== 'both') {
      displayMode.value = 'both';
      displayMode.dispatchEvent(new tableDoc.defaultView.Event('change', { bubbles: true }));
      await new Promise(resolve => setTimeout(resolve, 50));
    }

    for (const frame of frames) {
      const btn = frame.contentDocument?.getElementById('fetchBtn');
      if (btn) btn.click();
    }
    await Promise.all(frames.map(frame => waitForButton(frame)));

    if (displayMode && previousMode !== 'both') {
      displayMode.value = previousMode;
      displayMode.dispatchEvent(new tableDoc.defaultView.Event('change', { bubbles: true }));
    }
  }

  async function fetchForAll() {
    if (framesReady < frames.length) {
      setGlobalStatus('warning', 'ระบบกำลังโหลด', 'กรุณากดอีกครั้งหลังทั้ง 3 ระบบโหลดครบ');
      return;
    }
    fetchAllBtn.disabled = true;
    sharedPayloads.clear();
    sharedErrors.clear();
    updateGraphManualPrompts(new Map());
    setGlobalStatus('loading', 'กำลังดึงข้อมูล…', 'กำลังขอข้อมูล P.67 และ P.1 ชุดเดียวสำหรับทั้ง 3 ระบบ');

    const base = getWorkerBase();
    const stations = ['P.67', 'P.1'];
    const results = await Promise.allSettled(stations.map(station => requestStation(base, station)));
    results.forEach((result, index) => {
      const station = stations[index];
      if (result.status === 'fulfilled') sharedPayloads.set(station, result.value);
      else sharedErrors.set(station, result.reason?.name === 'AbortError' ? 'หมดเวลารอข้อมูล' : (result.reason?.message || 'ดึงข้อมูลไม่สำเร็จ'));
    });

    try {
      await triggerAllSystems();
      const success = stations.filter(station => sharedPayloads.has(station));
      const failed = stations.filter(station => !sharedPayloads.has(station));
      const graphIssues = collectGraphManualIssues();
      updateGraphManualPrompts(graphIssues);
      const graphNote = graphIssues.size
        ? ` • ระบบ 2 จุดแบบกราฟเปิดช่องกรอกเองให้แล้ว: ${[...graphIssues.keys()].join(' และ ')}`
        : '';
      const hasOutdatedHourlyData = [...graphIssues.values()].some(reason => String(reason).includes('ข้อมูลยังไม่ใช่ล่าสุด'));

      if (!failed.length && !graphIssues.size) {
        setGlobalStatus('success', 'อัปเดตทั้ง 3 ระบบแล้ว', 'ดึงข้อมูล P.67 และ P.1 สำเร็จ และนำข้อมูลชุดเดียวกันไปใช้ครบทุกแท็บ');
      } else if (!failed.length && graphIssues.size) {
        setGlobalStatus(
          'warning',
          hasOutdatedHourlyData ? 'ข้อมูลยังไม่ใช่ล่าสุด' : 'ข้อมูลสำหรับระบบกราฟยังไม่ครบ',
          `${[...graphIssues].map(([station, reason]) => `${station}: ${reason}`).join(' • ')}${graphNote}`
        );
      } else if (success.length) {
        setGlobalStatus('warning', 'อัปเดตได้บางจุด', `${success.join(' และ ')} สำเร็จ • ${failed.map(station => `${station}: ${sharedErrors.get(station)}`).join(' • ')}${graphNote}`);
      } else {
        setGlobalStatus('error', 'ดึงข้อมูลไม่สำเร็จ', `${failed.map(station => `${station}: ${sharedErrors.get(station)}`).join(' • ')}${graphNote}`);
      }
    } catch (error) {
      setGlobalStatus('error', 'อัปเดตระบบไม่สำเร็จ', error?.message || 'กรุณาลองใหม่');
    } finally {
      fetchAllBtn.disabled = false;
    }
  }

  tabs.forEach(tab => tab.addEventListener('click', () => {
    const index = Number(tab.dataset.index || 0);
    tabs.forEach((item, i) => item.classList.toggle('active', i === index));
    panels.forEach((panel, i) => panel.classList.toggle('active', i === index));
    const frame = frames[index];
    requestAnimationFrame(() => {
      resizeFrame(frame);
      setTimeout(() => resizeFrame(frame), 250);
      setTimeout(() => resizeFrame(frame), 900);
    });
  }));

  frames.forEach((frame, index) => {
    frame.addEventListener('load', () => patchFrame(frame, index));
    frame.src = SYSTEMS[index].src;
  });

  fetchAllBtn.addEventListener('click', fetchForAll);
})();
</script>
</body>
</html>
